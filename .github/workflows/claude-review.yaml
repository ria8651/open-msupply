name: Claude Auto Review
on:
  issue_comment:
    types: [created]

jobs:
  review:
    if: |
      contains(github.event.comment.body, '@claude-review') &&
      github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: develop
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.issue.number }}

            Please review this pull request with a focus on:
            - Code quality and best practices
            - Potential bugs or issues
            - Security implications
            - Performance considerations

            If you can find an associated issue make sure to compare the features implemented by the PR with the associated issue 
            and note anything missed from the issue or added by the PR that isn't in the issue.

            Note: The PR branch is already checked out in the current working directory.

            Collect ALL inline comments first, then submit them in a single review using
            mcp__github__create_pull_request_review with event type "COMMENT".
            Do NOT post inline comments one by one as you find them.
            Only post GitHub comments - don't submit review text as messages.

          claude_args: |
            --allowedTools "mcp__github__create_pull_request_review,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --model claude-sonnet-4-6
